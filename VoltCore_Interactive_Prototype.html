  <script>
/* VOLTCORE — clickable HCI concept prototype. All data is illustrative; no external services. */
const paths={overview:'Design overview',dashboard:'Dashboard',stations:'Find a charger',details:'Charger details',active:'Live charging session',summary:'Session summary',history:'Charging history',payments:'Wallet & payments',notifications:'Notifications & feedback',account:'My account',login:'Sign in',register:'Create account'};
const pathsMenu=['overview','dashboard','stations','active','history','payments','notifications','account'];
const iconPaths={bolt:'<path d="m13 2-9 11h7l-1 9 10-12h-7l1-8Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 2"/>',wallet:'<rect x="2" y="5" width="20" height="15" rx="3"/><path d="M2 9h20m-4 6h1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',logout:'<path d="M10 17l5-5-5-5m5 5H3m9-9h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',left:'<path d="M20 12H4m7-7-7 7 7 7"/>',search:'<circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/>',check:'<path d="m4 12 5 5L20 6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',plug:'<path d="M8 3v6m8-6v6M5 9h14v3a7 7 0 0 1-7 7v3M8 9v3m8-3v3"/>',activity:'<path d="M2 12h4l3-7 5 14 3-7h5"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',chevron:'<path d="m6 9 6 6 6-6"/>',shield:'<path d="m12 2 9 4v6c0 6-4.5 9-9 10-4.5-1-9-4-9-10V6l9-4Z"/><path d="m8 12 3 3 5-5"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',energy:'<path d="M3 4v16m0 0h18M7 16l4-5 4 2 5-7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',receipt:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3Z"/><path d="M9 8h6m-6 4h6m-6 4h3"/>',sparkle:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/>',external:'<path d="M13 5h6v6m0-6-9 9"/><path d="M19 14v5H5V5h5"/>',message:'<path d="M21 11a8 8 0 0 1-8 8H5l-3 3v-9a9 9 0 1 1 19-2Z"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',pause:'<path d="M9 5v14m6-14v14"/>',alert:'<path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 4v.1"/>',star:'<path d="m12 2 3 6.5 7 .9-5 5.1 1.2 7-6.2-3.3-6.2 3.3 1.2-7-5-5.1 7-.9L12 2Z"/>'};
function I(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.bolt}</svg>`;}
function logo(){return `<div class="brand" onclick="go('overview')" role="button" tabindex="0" aria-label="VoltCore design overview"><div class="brand-symbol">${I('bolt',22)}</div><div><div class="brand-name">Volt<span>Core</span></div><div class="brand-tagline">EV Charging Platform</div></div></div>`;}
const stations=[{id:'VC-014',name:'Hatfield ChargeHub',where:'Hatfield, Pretoria',distance:'2.4 km',power:150,price:6.2,connectors:'CCS2 · Type 2',availability:'available',slots:'3 of 4',lat:27,lon:34},{id:'VC-021',name:'Brooklyn EV Point',where:'Brooklyn, Pretoria',distance:'4.8 km',power:60,price:5.8,connectors:'CCS2 · Type 2',availability:'available',slots:'2 of 3',lat:62,lon:58},{id:'VC-032',name:'Menlyn GridStation',where:'Menlyn, Pretoria',distance:'7.1 km',power:120,price:6.8,connectors:'CCS2',availability:'occupied',slots:'0 of 4',lat:75,lon:30},{id:'VC-043',name:'Centurion RapidCharge',where:'Centurion, Pretoria',distance:'14.2 km',power:50,price:5.5,connectors:'Type 2',availability:'fault',slots:'Unavailable',lat:43,lon:70}];
const statusLabels={available:'Available',charging:'Charging',occupied:'Occupied',fault:'Fault reported',offline:'Offline',completed:'Completed'};
let state={page:'overview',selected:'VC-014',filter:'all',search:'',session:false,minutes:0,justStopped:false,feedback:false,wallet:260.00,tab:'all',email:'driver@voltcore.demo',modal:false,completed:[],notifications:[{title:'Welcome to VoltCore',description:'Your EV charging workspace is ready to explore.',when:'Now',kind:'info',unread:true},{title:'Charging system online',description:'Prototype demonstration connected to sample charging stations.',when:'Today',kind:'success',unread:false},{title:'Station issue reported',description:'Centurion RapidCharge is currently marked unavailable.',when:'Yesterday',kind:'warning',unread:false}]};
let startedAt=null;let ticker=null;
function e(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')};
function station(){return stations.find(s=>s.id===state.selected)||stations[0]};
function money(n){return `R${Number(n).toFixed(2)}`};
function status(st){return `<span class="status ${st}">${statusLabels[st]||st}</span>`};
function button(label,fn,style='primary',extra=''){return `<button class="btn ${style}" ${extra} onclick="${fn}">${label}</button>`};
function cardStart(heading,sub=''){return `<div class="card card-pad"><div class="panel-heading"><h3>${heading}</h3>${sub}</div>`;}
function chargerArt(){return `<svg viewBox="0 0 290 290" xmlns="http://www.w3.org/2000/svg" aria-label="Illustrated electric vehicle charging station" role="img"><defs><linearGradient id="body" x1="0" x2="1"><stop stop-color="#b7e3fc"/><stop offset=".45" stop-color="#f0f9ff"/><stop offset="1" stop-color="#7aa9cc"/></linearGradient><linearGradient id="panel" x1="0" x2="1"><stop stop-color="#173e61"/><stop offset="1" stop-color="#07162a"/></linearGradient><linearGradient id="glow" x1="0" x2="1"><stop stop-color="#0985ef"/><stop offset="1" stop-color="#22d3e8"/></linearGradient></defs><ellipse cx="135" cy="266" rx="89" ry="15" fill="#061728" opacity=".35"/><path d="M93 56q0-11 11-11h71q12 0 12 11v190H93V56Z" fill="url(#body)"/><path d="M93 64q0-13 13-13h67q7 0 7 7v172H93V64Z" fill="#d6efff" opacity=".3"/><rect x="107" y="65" width="62" height="90" rx="7" fill="url(#panel)"/><rect x="113" y="74" width="50" height="55" rx="4" fill="#092841"/><path d="M137 82 125 103h11l-3 16 17-25h-12l3-12Z" fill="#35d9f4"/><rect x="116" y="137" width="44" height="6" rx="3" fill="#2cc5e8"/><rect x="112" y="169" width="55" height="5" rx="2" fill="#95bfd8"/><rect x="124" y="185" width="31" height="4" rx="2" fill="#8fb3cb"/><path d="M187 99q40-17 44 24v67q0 18-17 19h-10" fill="none" stroke="#172f46" stroke-width="11" stroke-linecap="round"/><path d="M187 99q40-17 44 24v67q0 18-17 19h-10" fill="none" stroke="#5b839e" stroke-width="3" stroke-linecap="round" opacity=".6"/><rect x="195" y="195" width="17" height="26" rx="5" fill="#132d43"/><rect x="199" y="191" width="9" height="11" rx="2" fill="#38d2eb"/><path d="M102 238h78v18h-78Z" fill="#709bb9"/><rect x="82" y="254" width="109" height="9" rx="3" fill="#b9e2fd"/><path d="M94 60h4v180h-4Z" fill="#52cced" opacity=".65"/></svg>`;}
function heading(kicker,title,subtitle,right=''){return `<div class="title-row"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtext">${subtitle}</p></div>${right}</div>`};
function nav(){const options=[['overview','grid'],['dashboard','activity'],['stations','map'],['active','bolt'],['history','history'],['payments','wallet'],['notifications','bell'],['account','user']];return `<aside class="sidebar">${logo()}<div class="nav-kicker">Workspace</div>${options.slice(0,5).map(([p,ic])=>`<button class="nav-link ${state.page===p?'active':''}" onclick="go('${p}')">${I(ic,17)}<span>${paths[p]}</span></button>`).join('')}<div class="nav-kicker">Your account</div>${options.slice(5).map(([p,ic])=>`<button class="nav-link ${state.page===p?'active':''}" onclick="go('${p}')">${I(ic,17)}<span>${paths[p]}</span></button>`).join('')}<div class="sidebar-bottom"><div class="side-promo"><div class="spark">${I('sparkle',17)}</div><b>Designed around the driver.</b><p>Find. Check. Start. Monitor. Stop. Review.</p></div><div class="side-profile"><div class="avatar">OD</div><div><strong style="font-size:12px">VoltCore Driver</strong><div class="tiny">Demo account</div></div></div></div></aside>`}
function shell(content){return `<div class="app-shell">${nav()}<div class="workspace"><header class="topbar"><div class="breadcrumb">VoltCore ${I('arrow',13)} <strong>${paths[state.page]||'Prototype'}</strong></div><div class="top-actions"><span class="prototype-badge">INTERACTIVE CONCEPT</span><span class="live-pill"><i class="live-dot"></i> Prototype ready</span><button onclick="go('notifications')" aria-label="Notifications">${I('bell',17)}</button><button onclick="go('account')" aria-label="Profile">${I('user',17)}</button></div></header><main class="main-content">${content}<div class="page-footer"><span>VoltCore · Human–Computer Interaction · Design prototype</span><span>Concept data only • No charger or payment connected</span></div></main></div></div>${state.modal?modal():''}`;}
function metric(icon,num,label,note,type=''){return `<div class="card metric"><div class="metric-icon ${type}">${I(icon,19)}</div><div class="metric-label">${label}</div><div class="metric-value">${num}</div><div class="metric-note">${note}</div></div>`};
function stationRow(s){return `<div class="station-row"><div class="station-icon">${I('plug',20)}</div><div><h3>${s.name}</h3><p>${s.where} &nbsp;•&nbsp; ${s.power} kW DC</p></div><div class="station-row-end">${status(s.availability)}${button('Details '+I('arrow',13),`selectStation('${s.id}')`,'light sm')}</div></div>`;}
function dashboard(){return shell(`${heading('YOUR CHARGING WORKSPACE','Good afternoon, driver.','Manage your charging, explore stations, and track every session.',button('Find a charger '+I('arrow',16),"go('stations')"))}<section class="hero"><div class="hero-label">${I('bolt',12)} POWERING WHAT'S NEXT</div><h2>A better charging journey starts here.</h2><p>Everything you need to find your next charge, control your session, and move with confidence.</p>${button('Explore charging stations '+I('arrow',16),"go('stations')") }<div class="charger-illus">${chargerArt()}</div></section><div class="grid cols-4" style="margin-top:18px">${metric('map','04','Nearby stations','Pretoria demo area')}${metric('plug','05','Connectors available','Sample availability','teal')}${metric('energy','150 kW','Fastest charger','Hatfield ChargeHub','purple')}${metric('wallet',money(state.wallet),'Wallet balance','Prototype wallet','orange')}</div><div class="two-columns"><section><div class="section-title"><h2>Recommended charging stations</h2><button class="text-link" onclick="go('stations')">View all ${I('arrow',13)}</button></div><div class="card card-pad">${stations.slice(0,3).map(stationRow).join('')}</div></section><section><div class="section-title"><h2>Recent activity</h2><small>Demo updates</small></div><div class="card card-pad">${activityItem('bolt','Charging platform ready','Your dashboard is configured for the demo.','Now')}${activityItem('check','Station network preview','Four sample Pretoria-area stations loaded.','Today')}${activityItem('shield','Designed for confidence','Clear status labels and confirmation states.','Today')}</div></section></div>`)}
function activityItem(icon,title,desc,when){return `<div class="activity-item"><div class="activity-icon">${I(icon,16)}</div><div><h4>${title}</h4><p>${desc}</p></div><div class="activity-time">${when}</div></div>`}
function overview(){const journey=[['Discover','stations','Find chargers'],['Compare','stations','Check availability'],['Inspect','details','Review charger'],['Start','active','Begin session'],['Monitor','active','Track charging'],['Review','summary','Close the loop']];const screens=[['dashboard','Driver dashboard','Charging overview'],['stations','Station discovery','Search and compare'],['details','Charger details','Cost and connector'],['active','Active session','Real-time status'],['summary','Session summary','Confirmation and receipt'],['history','Charging history','Previous activity'],['payments','Wallet & payments','Charging finances'],['notifications','Feedback & alerts','Driver communication']];return shell(`${heading('LECTURER PRESENTATION • PART 2','The VoltCore design vision','An interactive, user-centred EV charging experience mapped directly to the Part 1 requirements.',button('Launch user journey '+I('arrow',15),"go('login')"))}<section class="overview-hero"><div><div class="hero-label">${I('sparkle',13)} HCI PROTOTYPE • PROJECT OVERVIEW</div><h2>Complex technology. A simple charging experience.</h2><p>VoltCore translates charging hardware, pricing, availability and live session data into clear decisions and predictable actions. This is a demonstration prototype, not a live network.</p></div><div class="overview-stat"><strong>08</strong><span>Core interface views<br> + login, registration and account screens</span><div class="divider" style="border-color:#ffffff26;margin:12px 0"></div><span>${I('check',14)} Clickable user journey</span></div></section><div class="section-title"><h2>01 — The complete driver journey</h2><small>Select a stage to preview it</small></div><div class="journey-track">${journey.map(([name,page,sub],idx)=>`<button class="journey-step" onclick="${idx===3?"beginSession()":`go('${page}')`}"><div class="step-num">0${idx+1}</div><b>${name}</b><small>${sub}</small></button>`).join('')}</div><div class="section-title"><h2>02 — The interface collection</h2><small>Choose a screen to explore</small></div><div class="showcase-grid">${screens.map(([page,title,subtitle],idx)=>`<button class="showcase" onclick="go('${page}')"><div class="screen-thumb ${idx===3?'dark':idx%3===1?'alt':''}"><div class="thumb-side"></div><div class="thumb-inner"><div class="thumb-top"></div><div class="thumb-block"></div><div class="thumb-stats"><i></i><i></i><i></i></div></div></div><b>${String(idx+1).padStart(2,'0')} — ${title}</b><small>${subtitle} ${I('arrow',11)}</small></button>`).join('')}</div><div class="section-title"><h2>03 — Charger status language</h2><small>Color plus explicit text</small></div><div class="card card-pad"><div class="flex-between" style="flex-wrap:wrap;gap:17px"><div>${status('available')}<p class="tiny">Ready to use</p></div><div>${status('charging')}<p class="tiny">Live session</p></div><div>${status('occupied')}<p class="tiny">In use by another driver</p></div><div>${status('fault')}<p class="tiny">Unavailable due to issue</p></div><div>${status('offline')}<p class="tiny">Not connected</p></div><div>${status('completed')}<p class="tiny">Charging finished</p></div></div></div><div class="section-title"><h2>04 — HCI design decisions</h2><small>Traceable to the Part 1 report</small></div><div class="grid cols-3">${[['Visibility','Status, cost, speed and primary actions appear where users make decisions.'],['Feedback','Start, stop and issue-reporting actions produce explicit confirmation.'],['Constraints','Unavailable chargers cannot begin a session; destructive actions require confirmation.'],['Consistency','One navigation system, button language and reusable status components.'],['Accessibility','Keyboard-friendly controls, text labels and clear contrast.'],['Task-first design','Every screen supports Find → Check → Start → Monitor → Stop → Review.']].map(([a,b])=>`<div class="principle-tag"><b>${I('check',14)} &nbsp;${a}</b><p>${b}</p></div>`).join('')}</div><div class="section-title"><h2>05 — Prototype delivery status</h2></div><div class="card card-pad"><div class="grid cols-3">${[['Design coverage','Complete screen concepts'],['Navigation flow','Clickable prototype'],['Integration','Simulation only; backend not connected']].map(([a,b])=>`<div><div class="tiny" style="margin-bottom:8px">${a}</div><strong style="font-size:14px">${b}</strong></div>`).join('')}</div><p class="mode-note" style="margin:18px 0 0">Lecturer note: locations, prices, battery data and wallet values are illustrative. This prototype demonstrates interaction design, not operational EV charging or live payment processing.</p></div>`)}
function stationsPage(){let data=stations.filter(s=>(state.filter==='all'||(state.filter==='fast'&&s.power>=100)||(state.filter==='available'&&s.availability==='available')||(state.filter===s.availability))&&(s.name+' '+s.where+' '+s.connectors).toLowerCase().includes(state.search.toLowerCase()));return shell(`${heading('CHARGING STATION DISCOVERY','Find your next charge','Compare charging speeds, pricing and live-style availability at a glance.',`<span class="prototype-badge">SAMPLE STATION DATA</span>`)}<div class="search-tools"><label class="searchbox">${I('search',18)}<input type="search" id="station-search" placeholder="Search a station, suburb or connector" value="${e(state.search)}" oninput="searchStations(this.value)" aria-label="Search stations" /></label>${[['all','All stations'],['available','Available'],['fast','Fast charging']].map(([val,label])=>`<button class="filter-btn ${state.filter===val?'selected':''}" onclick="filterStations('${val}')">${label}</button>`).join('')}</div><div class="two-columns"><section><div class="flex-between" style="margin-bottom:15px"><h2 style="font-size:16px;margin:0">Stations near Pretoria</h2><small class="muted-label">${data.length} locations</small></div><div class="station-cards">${data.length?data.map(s=>`<div class="card station-card"><div class="station-card-head"><div class="station-icon">${I('plug',20)}</div><div><h3>${s.name}</h3><p>${I('pin',12)} ${s.where} · ${s.distance}</p></div>${status(s.availability)}</div><div class="stat-pair"><div><label>Power</label><b>${s.power} kW</b></div><div><label>Connectors</label><b>${s.connectors}</b></div><div><label>Available</label><b>${s.slots}</b></div></div><div class="station-card-footer"><div><span>From</span><br><strong>${money(s.price)}</strong><small> / kWh</small></div>${button('View charger '+I('arrow',13),`selectStation('${s.id}')`,'primary sm')}</div></div>`).join(''):`<div class="card empty-state">${I('search',30)}No matching stations. Try another search or filter.</div>`}</div></section><section><div class="flex-between" style="margin-bottom:15px"><h2 style="font-size:16px;margin:0">Station map</h2><small class="muted-label">Illustration only</small></div><div class="card card-pad"><div class="map-area">${stations.map(s=>`<button class="map-pin ${s.availability==='fault'?'danger':s.availability==='occupied'?'muted':''}" style="left:${s.lat}%;top:${s.lon}%" onclick="selectStation('${s.id}')" title="${s.name}">${I('bolt',15)}</button>`).join('')}<div class="map-road one"></div><div class="map-road two"></div></div><div class="flex-between" style="margin-top:17px"><div><b style="font-size:12px">Status-based discovery</b><p class="tiny" style="margin:5px 0">Tap a map marker or choose a station card.</p></div>${status('available')}</div></div></section></div>`)}
function details(){const s=station();return shell(`${heading('STATION DETAILS',s.name,`${I('pin',14)} ${s.where} · Charger reference ${s.id}`,button(I('left',15)+' Back to stations',"go('stations')",'light'))}<div class="details-layout"><section><div class="card card-pad"><div class="detail-banner"><span>VOLTCORE • SAMPLE CHARGER</span><div class="station-art">${chargerArt()}</div></div><div class="flex-between" style="margin:20px 0 18px"><div><b style="font-size:18px">DC charging station</b><p class="muted-label" style="margin:6px 0">Charging information and connector details</p></div>${status(s.availability)}</div><div class="info-grid"><div class="info-tile"><label>Maximum output</label><b>${s.power} kW</b></div><div class="info-tile"><label>Connector standard</label><b>${s.connectors}</b></div><div class="info-tile"><label>Available connectors</label><b>${s.slots}</b></div><div class="info-tile"><label>Estimated distance</label><b>${s.distance}</b></div></div></div></section><aside><div class="card detail-side"><div class="eyebrow">CHARGING RATE</div><div class="large-price">${money(s.price)} <small>/ kWh</small></div><p class="muted-label">Illustrative usage pricing, not a live tariff.</p><div class="divider"></div><h3 style="font-size:15px">Ready when you are</h3>${[['plug','Select a compatible connector'],['check','Review price and availability'],['shield','Confirm before charging begins']].map(([ic,txt])=>`<div class="checklist">${I(ic,17)} ${txt}</div>`).join('')}<div class="divider"></div>${s.availability==='available'?button('Start charging '+I('arrow',16),'beginSession()','primary wide'):button('Charger not available',"notify('This charger cannot begin a session')",'light wide','disabled')}<p class="tiny" style="text-align:center;margin:14px 0 0">${s.availability==='available'?'Demonstration mode · No physical charger is connected':'Choose another available charger to continue'}</p></div><div class="soft-note" style="margin-top:16px">${I('info',15)} &nbsp;The interface shows what the driver needs: compatibility, status, cost and a clear next action.</div></aside></div>`)}
function startSession(){state.session=true;state.minutes=18;startedAt=Date.now();state.modal=false;state.justStopped=false;notify('Charging session started — demonstration mode');go('active');}
function beginSession(){if(!state.session){const s=station();if(s.availability!=='available') {state.selected='VC-014'}state.modal='start';render()}else go('active')}
function active(){if(!state.session)return shell(`${heading('SESSION STATUS','No active charging session','Start a demonstration charge to see live session monitoring.',button('Find a charger '+I('arrow',14),"go('stations')"))}<div class="card card-pad" style="max-width:680px;margin:36px auto;text-align:center;padding:45px"><div class="metric-icon" style="margin:0 auto 15px;width:55px;height:55px">${I('bolt',28)}</div><h2>Ready for your next charge?</h2><p class="subtext" style="margin-bottom:19px">Find an available station and select Start Charging to create a demo session.</p>${button('Browse charging stations '+I('arrow',15),"go('stations')")}</div>`);const energy=(8.4+Math.max(0,state.minutes-18)*.09).toFixed(1);const cost=(Number(energy)*station().price).toFixed(2);return shell(`${heading('LIVE CHARGING','Your session is in progress','Session metrics update in demonstration mode.',`<span class="prototype-badge">SIMULATED TELEMETRY</span>`)}<div class="session-layout"><section class="session-hero"><div class="flex-between" style="position:relative;z-index:1">${status('charging')}<span style="font-size:10px;color:#91bfd5">CHARGER ${station().id}</span></div><div style="text-align:center;position:relative;z-index:1"><h2>Charging in progress</h2><p>${station().name} · ${station().power} kW</p><div class="charge-ring"><div class="ring-content"><b>62%</b><small>Estimated battery level</small></div></div><p>Session is active and charging successfully</p></div></section><aside><div class="grid cols-2 session-metrics">${[['clock','Duration',`${String(Math.floor(state.minutes/60)).padStart(2,'0')}:${String(state.minutes%60).padStart(2,'0')}:00`,'Elapsed demo time'],['bolt','Energy delivered',`${energy} kWh`,'Updated during demo'],['wallet','Estimated cost',money(cost),'Based on sample tariff'],['activity','Charging speed',`${station().power} kW`,'Charger rated output']].map(([ic,label,value,note])=>`<div class="card session-metric"><div class="metric-icon">${I(ic,19)}</div><label>${label}</label><h3>${value}</h3><p>${note}</p></div>`).join('')}</div><div class="card card-pad" style="margin-top:15px"><div class="flex-between"><strong style="font-size:13px">Session controls</strong>${status('charging')}</div><p class="help-lines">Stopping will end the demo session and create a receipt. You can review the result before returning to your history.</p>${button('Stop charging '+I('pause',16),"openStopModal()",'danger wide')}</div></aside></div>`)}
function summary(){if(!state.justStopped && !state.completed.length)return shell(`${heading('SESSION COMPLETED','Session summary','A completed demo session will appear here.') }<div class="card card-pad" style="text-align:center;max-width:660px;margin:30px auto"><p class="subtext">Start and stop a demonstration charge to generate a summary.</p>${button('Find charger',"go('stations')")}</div>`);const item=state.completed[0];return shell(`${heading('CHARGING COMPLETED','Your charging session is complete','A clear confirmation and transparent session breakdown.',button('View charging history '+I('arrow',14),"go('history')"))}<div class="card confirm-panel"><div class="big-check">${I('check',35)}</div><div class="eyebrow" style="margin-top:22px">SESSION COMPLETED</div><h2>Charge complete.</h2><p class="subtext">Your charging session has ended successfully in the prototype.</p><div class="receipt"><div class="line-item"><span>Station</span><strong>${item.station}</strong></div><div class="line-item"><span>Session ID</span><strong>${item.id}</strong></div><div class="line-item"><span>Date</span><strong>${item.date}</strong></div><div class="line-item"><span>Duration</span><strong>${item.duration}</strong></div><div class="line-item"><span>Energy delivered</span><strong>${item.energy}</strong></div><div class="line-item total"><span>Total cost</span><strong>${item.cost}</strong></div></div>${button('View session history '+I('arrow',15),"go('history')",'primary wide')}<div style="margin-top:10px">${button('Report an issue',"go('notifications')",'light wide')}</div><p class="tiny" style="margin:20px 0 0">Illustrative amounts only; no payment has been taken.</p></div>`)}
function history(){const previous=[...state.completed,{id:'VC-S0183',date:'14 Oct 2026',station:'Brooklyn EV Point',duration:'00:32:18',energy:'12.5 kWh',cost:'R72.50'},{id:'VC-S0172',date:'08 Oct 2026',station:'Hatfield ChargeHub',duration:'00:23:05',energy:'9.2 kWh',cost:'R57.04'},{id:'VC-S0166',date:'01 Oct 2026',station:'Menlyn GridStation',duration:'00:44:10',energy:'20.1 kWh',cost:'R136.68'}];return shell(`${heading('CHARGING HISTORY','Every charge, clearly recorded','Review your charging sessions, energy delivered and costs.',button('Find a charger '+I('arrow',14),"go('stations')"))}<div class="grid cols-3">${metric('history',String(previous.length).padStart(2,'0'),'Recorded sessions','Includes illustrative history')}${metric('bolt',`${previous.reduce((a,x)=>a+parseFloat(x.energy),0).toFixed(1)} kWh`,'Total energy','Illustrative sample data','teal')}${metric('wallet',money(previous.reduce((a,x)=>a+Number(x.cost.replace('R','')),0)),'Total cost','Based on demo tariffs','purple')}</div><div class="section-title"><h2>Session records</h2><span class="prototype-badge">SAMPLE RECORDS</span></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Session ID</th><th>Station</th><th>Date</th><th>Duration</th><th>Energy</th><th>Cost</th><th>Status</th></tr></thead><tbody>${previous.map(x=>`<tr><td><strong>${x.id}</strong></td><td>${x.station}</td><td>${x.date}</td><td>${x.duration}</td><td>${x.energy}</td><td><strong>${x.cost}</strong></td><td>${status('completed')}</td></tr>`).join('')}</tbody></table></div>`)}
function payments(){return shell(`${heading('WALLET & PAYMENTS','Charging finances, simplified','Understand your balance and estimated charging costs at a glance.',`<span class="prototype-badge">DEMO WALLET</span>`)}<div class="two-columns"><section><div class="wallet-card"><small>AVAILABLE WALLET BALANCE</small><strong>${money(state.wallet)}</strong><span>VoltCore · Demonstration wallet</span></div><div class="section-title"><h2>Quick actions</h2></div><div class="card card-pad"><h3 style="font-size:14px;margin:0 0 13px">Add demo credit</h3><p class="subtext" style="font-size:11px;margin-bottom:17px">This only changes the prototype balance. No money moves.</p><div class="grid cols-3">${[50,100,200].map(n=>button(`+ R${n}`,`topUp(${n})`,'light')).join('')}</div></div></section><section><div class="card card-pad"><div class="panel-heading"><h3>Pricing transparency</h3>${I('info',18)}</div><p class="help-lines">Before charging begins, VoltCore displays the station's indicative per-kWh tariff. During charging, it displays an estimated running cost. At completion, it provides a summary.</p><div class="divider"></div><b style="font-size:12px">Sample rates</b>${stations.slice(0,3).map(s=>`<div class="flex-between" style="padding:13px 0;border-bottom:1px solid #edf1f6"><span class="tiny">${s.name}</span><strong style="font-size:12px">${money(s.price)} / kWh</strong></div>`).join('')}</div></section></div>`)}
function notifications(){return shell(`${heading('FEEDBACK & COMMUNICATION','Know what is happening','Understand system events and report a problem when you need help.') }<div class="two-columns"><section><div class="section-title" style="margin-top:0"><h2>Notifications</h2><small>${state.notifications.length} updates</small></div><div class="card card-pad notice-list">${state.notifications.map(n=>`${activityItem(n.kind==='warning'?'alert':n.kind==='success'?'check':'bell',n.title,n.description,n.when)}`).join('')}</div></section><section><div class="section-title" style="margin-top:0"><h2>Report a charger issue</h2><small>Feedback form</small></div><div class="card card-pad"><form id="feedback-form" onsubmit="submitFeedback(event)"><label class="form-field"><span>Station</span><select name="station" class="form-control" required>${stations.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="form-field"><span>Issue type</span><select name="type" class="form-control" required><option value="Charger unavailable">Charger unavailable</option><option value="Session failed to start">Session failed to start</option><option value="Incorrect information">Incorrect information</option><option value="Pricing question">Pricing question</option><option value="Other issue">Other issue</option></select></label><label class="form-field"><span>Describe the issue</span><textarea name="message" class="form-control" placeholder="Tell us what happened..." required minlength="8"></textarea></label><button class="btn primary wide" type="submit">Submit issue report ${I('arrow',15)}</button></form><p class="tiny" style="margin-top:13px">This is a prototype: submissions appear locally as a confirmation.</p></div></section></div>`)}
function account(){return shell(`${heading('YOUR ACCOUNT','Account preferences','A simple place for driver details and profile options.') }<div class="two-columns"><section><div class="card card-pad"><div class="account-box"><div class="avatar">OD</div><div><h3 style="margin:0 0 6px">VoltCore Driver</h3><p class="tiny" style="margin:0">Demo account · Standard driver access</p></div>${status('available')}</div><div class="divider"></div><label class="form-field"><span>Display name</span><input class="form-control" value="VoltCore Driver" /></label><label class="form-field"><span>Email address</span><input class="form-control" type="email" value="${e(state.email)}" id="profile-email" /></label><label class="form-field"><span>Preferred connector</span><select class="form-control"><option>CCS2</option><option>Type 2</option></select></label>${button('Save preferences',"saveAccount()")}</div></section><section><div class="card card-pad"><div class="panel-heading"><h3>Experience settings</h3>${I('shield',20)}</div>${[['Accessible status labels','Status chips always include readable text.'],['Consistent navigation','Primary tasks remain in the same location.'],['Clear confirmation','Important actions require or provide confirmation.']].map(([x,y])=>`<div class="checklist" style="align-items:flex-start">${I('check',17)} <span><b>${x}</b><br><small class="tiny">${y}</small></span></div>`).join('')}<div class="divider"></div>${button('Return to design overview',"go('overview')",'light wide')}</div></section></div>`)}
function auth(page){const register=page==='register';return `<div class="auth-layout"><section class="auth-left">${logo()}<div style="position:relative;z-index:1"><div class="eyebrow" style="color:#56ddf5">WELCOME TO THE FUTURE OF CHARGING</div><h1>Charge smarter.<br><span>Drive further.</span></h1><p>Find nearby stations, start a session, track your energy and know exactly where you stand.</p></div><div class="charger-illus">${chargerArt()}</div><div class="auth-left-foot">VOLTCORE · INTERACTIVE HCI DESIGN CONCEPT · 2026</div></section><section class="auth-right"><div class="auth-panel"><div class="eyebrow">${register?'CREATE YOUR ACCOUNT':'SECURE DRIVER ACCESS'}</div><h2>${register?'Start with VoltCore.':'Welcome back.'}</h2><p>${register?'Create a demo driver profile to explore the charging experience.':'Sign in to see your stations, sessions and charging activity.'}</p><form onsubmit="authSubmit(event,'${page}')">${register?`<label class="form-field"><span>Full name</span><input class="form-control" required placeholder="Your name" autocomplete="name"/></label>`:''}<label class="form-field"><span>Email address</span><input class="form-control" type="email" id="login-email" required placeholder="driver@example.com" autocomplete="email" value="${register?'':e(state.email)}"/></label><label class="form-field"><span>Password</span><input class="form-control" type="password" minlength="4" required placeholder="Enter a demo password" autocomplete="${register?'new-password':'current-password'}" value="demo1234"/></label><button type="submit" class="btn primary wide">${register?'Create demo account':'Sign in to VoltCore'} ${I('arrow',16)}</button></form><div class="auth-bottom">${register?'Already have a profile?':'New to VoltCore?'} <button onclick="go('${register?'login':'register'}')">${register?'Sign in':'Create account'}</button></div><div class="auth-note">${I('info',15)} &nbsp;Prototype only. Any email and a password of four or more characters will continue. There is no real authentication.</div><div style="text-align:center;margin-top:25px">${button(I('left',13)+' Back to presentation',"go('overview')",'light sm')}</div></div></section></div>`}
function modal(){const start=state.modal==='start';return `<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="${start?'Start':'Stop'} charging confirmation" onclick="if(event.target===this) closeModal()"><div class="modal"><div class="metric-icon ${start?'teal':''}">${I(start?'bolt':'alert',22)}</div><h2>${start?'Start demo charging?':'End charging session?'}</h2><p>${start?`VoltCore will simulate a charging session at <strong>${station().name}</strong>. No physical charger or payment is connected.`:'Ending the session will show a confirmation, duration, energy delivered and indicative cost.'}</p><div class="modal-actions">${button('Cancel','closeModal()','light')}${button(start?'Start charging':'Stop session',start?'startSession()':'stopSession()',start?'primary':'danger')}</div></div></div>`}
function stopSession(){const s=station();const energy=(8.4+Math.max(0,state.minutes-18)*.09).toFixed(1);const today=new Date();let date=today.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});state.completed.unshift({id:`VC-S${Math.floor(Date.now()/1000)%100000}`,date,station:s.name,duration:`00:${String(state.minutes).padStart(2,'0')}:00`,energy:`${energy} kWh`,cost:money(Number(energy)*s.price)});state.session=false;state.justStopped=true;state.modal=false;state.notifications.unshift({title:'Charging session completed',description:'A session summary is ready to review.',when:'Now',kind:'success'});notify('Session completed — receipt available');go('summary')}
function topUp(n){state.wallet+=n;notify(`Added R${n} demo credit to your balance`);render()}
function submitFeedback(evt){evt.preventDefault();const form=evt.currentTarget;const data=new FormData(form);state.notifications.unshift({title:'Issue report submitted',description:`${data.get('type')} · ${stations.find(s=>s.id===data.get('station'))?.name||'Selected station'} — received in demo mode.`,when:'Now',kind:'success'});state.feedback=true;notify('Issue report submitted in demo mode');render()}
function saveAccount(){const v=document.getElementById('profile-email')?.value||state.email;state.email=v;notify('Demo account preferences saved')}
function authSubmit(evt,page){evt.preventDefault();state.email=document.getElementById('login-email')?.value||state.email;notify(page==='register'?'Demo account created':'Signed into demo workspace');go('dashboard')}
function closeModal(){state.modal=false;render()};function openStopModal(){state.modal='stop';render()}
function selectStation(id){state.selected=id;go('details')}
function searchStations(val){state.search=val;const pos=document.getElementById('station-search')?.selectionStart;render();const field=document.getElementById('station-search');if(field){field.focus();try{field.setSelectionRange(pos,pos)}catch(e){}}}
function filterStations(val){state.filter=val;render()}
let toastHandle;function notify(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('visible');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('visible'),2800)}
function go(page){if(!paths[page])page='overview';state.page=page;try{window.history.replaceState(null,'',`#${page}`)}catch(e){}render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const app=document.getElementById('app');const renderers={overview,dashboard,stations:stationsPage,details,active,summary,history,payments,notifications,account};app.innerHTML=(state.page==='login'||state.page==='register')?auth(state.page):(renderers[state.page]||overview)();}
window.addEventListener('hashchange',()=>{let page=location.hash.slice(1);if(paths[page]&&page!==state.page){state.page=page;render()}});
const initial=location.hash.slice(1);if(paths[initial])state.page=initial;render();
/* One demo minute passes approximately every 12 seconds. This is intentionally simulated. */
ticker=setInterval(()=>{if(state.session){state.minutes++;if(state.page==='active')render()}},12000);

</script>
